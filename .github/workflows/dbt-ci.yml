name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  serving-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r app/requirements.txt pytest==8.3.5
      - run: python -m pytest -q tests

  dbt:
    name: dbt parse + dbt ls
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dbt
        run: |
          python -m pip install --upgrade pip
          pip install "dbt-core==1.10.11" "dbt-snowflake==1.10.2"

      - name: Write placeholder dbt profile
        env:
          DBT_PROFILES_DIR: ${{ github.workspace }}/.dbt
        run: |
          mkdir -p "$DBT_PROFILES_DIR"
          cat > "$DBT_PROFILES_DIR/profiles.yml" <<'YAML'
          ons_ml:
            target: dev
            outputs:
              dev:
                type: snowflake
                account: ci.placeholder.invalid
                user: ci_placeholder
                password: ci_placeholder
                role: ACCOUNTADMIN
                database: LAB_ONS
                warehouse: LAB_WH
                schema: STAGING_ONS
                threads: 1
          YAML

      - name: dbt deps
        run: dbt deps

      - name: dbt parse
        env:
          DBT_PROFILES_DIR: ${{ github.workspace }}/.dbt
        run: dbt parse

      - name: dbt ls --models (regression guard)
        env:
          DBT_PROFILES_DIR: ${{ github.workspace }}/.dbt
        run: |
          set -euo pipefail
          dbt ls --resource-type model > /tmp/dbt_models.txt
          echo "Models discovered:"
          cat /tmp/dbt_models.txt
          # All 8 staging models must resolve to snake_case filenames.
          for m in \
            ons_ml.staging.stg_balanco_energia_subsistema \
            ons_ml.staging.stg_disponibilidade_usina \
            ons_ml.staging.stg_ear_diario_subsistema \
            ons_ml.staging.stg_ena_diario_subsistema \
            ons_ml.staging.stg_fator_capacidade \
            ons_ml.staging.stg_geracao_termica_despacho \
            ons_ml.staging.stg_inmet_data \
            ons_ml.staging.stg_restricao_fotovoltaica; do
            grep -qxF "$m" /tmp/dbt_models.txt || {
              echo "FAIL: expected model $m is missing"; exit 1;
            }
          done
          echo "OK: all 8 staging models resolved correctly."

      # `dbt compile` and `dbt test` require a live Snowflake connection.
      # Run them in a credentialed environment (e.g. self-hosted runner with a
      # real LAB_ONS service account). The placeholder profile above is
      # sufficient for parse + ls; anything that touches Snowflake will fail
      # with "Database Error 290404" against the placeholder account.
